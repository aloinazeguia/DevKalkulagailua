name: Calculadora CI with Maven
on :
  pull_request:
    branches : ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '25' ]
    
    defaults:
      run:
        working-directory: ./kalkulagailua

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
      
      - name: Set up JDK  ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      
      - name: Compilar y ejecutar tests de la Calculadora
        run: mvn clean package
      
      - name: Guardar la Calculadora compilada
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-app
          path: kalkulagailua/target/*.jar
      
            

